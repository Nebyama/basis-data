<!DOCTYPE html>
<html lang="id">

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login ORESTE</title>
  <link rel="stylesheet" href="../style.css" />
</head>
<body>
  <header class="hero-shell">
    <nav class="topbar container">
      <a class="brand" href="index.html">ORESTE Static</a>
      <div class="topbar-links"><a href="index.html">Home</a><a href="dashboard.html">Dashboard</a></div>
    </nav>

  <main class="container stack" style="max-width: 640px;">

      <p class="eyebrow">Login</p>
